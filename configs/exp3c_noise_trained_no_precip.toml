# Experiment 3c — 1–3 day forecast with realistic weather-forecast inputs, Rhein–Diepoldsau (2473).
# As 3b, without the rain forecast (rain is the least accurate forecast variable).
# Same data, split and test windows as experiment 2.

name = "exp3c_noise_trained_no_precip"
start = "1995-01-01"
end = "2020-12-31"
train_end = "2014-12-31"
val_end = "2016-12-31"
lookback = 21
horizon = 3
max_gap = 7
elevation_m = 410
do_threshold_mgl = 6.0
targets = ["do_mgl", "water_temp"]
features = ["do_mgl", "water_temp", "ph", "conductivity", "do_sat_mgl", "doy_sin", "doy_cos",
  "air_temp", "air_temp_max", "precip", "global_radiation"]
future_features = ["air_temp", "air_temp_max", "global_radiation"]

[sources.camels_ch_chem]
stations = ["2473"]
root = "data/camels-ch-chem"

[sources.meteoswiss]
stations = ["VAD"]
granularity = "d"

[model]
type = "seq2seq_lstm"
hidden = 64
n_layers = 2
dropout = 0.2
lr = 0.001
epochs = 100
patience = 12
batch_size = 64
seed = 42
step_weights = [0.5, 0.3, 0.2]

[forecast_noise]
# real ICON-CH2 forecast errors at MeteoSwiss Vaduz (scripts/build_error_pool.py);
# even ISO weeks -> train/val, odd ISO weeks -> test; season-matched (+-45 days)
pool = "resources/forecast_errors/icon_ch2_VAD.csv"
seed = 123
season_days = 45
train = true
test = true
