# Experiment 2d — 1–3 day DO / temperature forecast, Rhein–Diepoldsau (gauge 2473).
# 2c + weather on the 3 forecast days, fed to the decoder.
# Uses OBSERVED weather as a perfect forecast: an upper bound on what real
# forecasts (ICON-CH) can add, not an operational result.
# Same split and test windows as experiment 1; horizon 3 days = the 24–72 h decision window.

name = "exp2d_future_weather_day1"
start = "1995-01-01"
end = "2020-12-31"
train_end = "2014-12-31"
val_end = "2016-12-31"
lookback = 21
horizon = 3
max_gap = 7
elevation_m = 410
do_threshold_mgl = 6.0
targets = ["do_mgl", "water_temp"]
features = ["do_mgl", "water_temp", "ph", "conductivity", "do_sat_mgl", "doy_sin", "doy_cos",
  "air_temp", "air_temp_max", "precip", "global_radiation"]
future_features = ["air_temp", "air_temp_max", "precip", "global_radiation"]

[sources.camels_ch_chem]
stations = ["2473"]
root = "data/camels-ch-chem"

[sources.meteoswiss]
stations = ["VAD"]
granularity = "d"

[model]
type = "seq2seq_lstm"
hidden = 64
n_layers = 2
dropout = 0.2
lr = 0.001
epochs = 100
patience = 12
batch_size = 64
seed = 42
step_weights = [0.5, 0.3, 0.2]
